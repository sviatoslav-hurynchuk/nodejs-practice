image: node:24

stages:
  - build
  - test
  - deploy

cache:
  key:
    files:
      - lab03/package-lock.json
  paths:
    - lab03/node_modules/

build-job:
  stage: build
  script:
    - cd lab03
    - npm ci
    - npm run build

test-job:
  stage: test
  script:
    - cd lab03
    - npm ci
    - npm run test:coverage

deploy-job:
  stage: deploy
  image: flyio/flyctl:latest
  script:
    - cd lab03
    - flyctl deploy --remote-only
  rules:
    - if: $CI_COMMIT_BRANCH == "main"